[package]
name = "s4mk3-hid-midi-bridge"
version = "0.3.0-beta.1"
edition = "2024"
rust-version = "1.88"
description = "Native Instruments S4 MK3 HID-to-MIDI bridge for Djay Pro on macOS"
publish = false
default-run = "s4mk3-hid-midi-bridge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
encdr = { git = "https://github.com/RufusIbiza/Encdr.git", rev = "5d7a689ca5789161b3efd1b2049d7e54504fe881" }
hidapi = { version = "2.6", features = ["macos-shared-device"] }
midir = "0.11"
nusb = "0.2.3"
num-traits = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.2.3"
mio = { version = "=1.2.4", default-features = false, features = ["s4-cancel-pipe-writes-on-drop"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
recvmsg = "=1.0.0"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "macros", "net", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "macros", "test-util", "net", "process", "io-util"] }

[patch.crates-io]
mio = { path = "vendor/mio" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
let_underscore_must_use = "deny"
